{% extends "base.html" %}
{% block title %}Issue Book — LibraryMS{% endblock %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-arrow-up-circle me-2"></i>Issue a Book</h2>

<div class="row">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <form method="post" action="{{ url_for('issue') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Book</label>
            <select class="form-select" name="book_id" required>
              <option value="" disabled {% if not selected_book_id %}selected{% endif %}>— select a book —</option>
              {% for b in books %}
              <option value="{{ b.book_id }}"
                {% if selected_book_id == b.book_id %}selected{% endif %}
                {% if b.available_copies == 0 %}disabled{% endif %}>
                {{ b.title }} ({{ b.available_copies }} available)
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Member</label>
            <select class="form-select" name="member_id" required>
              <option value="" disabled {% if not selected_member_id %}selected{% endif %}>— select a member —</option>
              {% for m in members %}
              <option value="{{ m.member_id }}"
                {% if selected_member_id == m.member_id %}selected{% endif %}>
                {{ m.full_name }} (ID {{ m.member_id }})
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Loan period (days)</label>
            <input type="number" class="form-control" name="loan_days" value="14" min="1" max="365">
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-check-circle me-2"></i>Issue Book
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
